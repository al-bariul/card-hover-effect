<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="cards-container">
      <div class="cards">
        <div class="card active">
          <h3>1st Card</h3>
          <img src="image.jpg" />
        </div>
        <div class="card">
          <h3>2nd Card</h3>
          <img src="image.jpg" />
        </div>
        <div class="card">
          <h3>3rd Card</h3>
          <img src="image.jpg" />
        </div>
        <div class="card">
          <h3>4th Card</h3>
          <img src="image.jpg" />
        </div>
        <div class="card">
          <h3>5th Card</h3>
          <img src="image.jpg" />
        </div>
      </div>
    </div>

    <div class="second-cards-container">
      <div class="second-cards">
        <div class="second-card">
          <img src="1st.jpg" alt="" />
          <div class="txt">
            <h1>WEB DESIGN</h1>
            <p>Lorem ipsum dolor sit amet.</p>
            <div class="icons">
              <i class="fa-brands fa-linkedin"></i>
              <i class="fa-brands fa-square-upwork"></i>
              <i class="fa-brands fa-twitter"></i>
            </div>
          </div>
        </div>
        <div class="second-card">
          <img src="2nd.jpg" alt="" />
          <div class="txt">
            <h1>WEB DESIGN</h1>
            <p>Lorem ipsum dolor sit amet.</p>
            <div class="icons">
              <i class="fa-brands fa-linkedin"></i>
              <i class="fa-brands fa-square-upwork"></i>
              <i class="fa-brands fa-twitter"></i>
            </div>
          </div>
        </div>
        <div class="second-card">
          <img src="3rd.jpg" alt="" />
          <div class="txt">
            <h1>WEB DESIGN</h1>
            <p>Lorem ipsum dolor sit amet.</p>
            <div class="icons">
              <i class="fa-brands fa-linkedin"></i>
              <i class="fa-brands fa-square-upwork"></i>
              <i class="fa-brands fa-twitter"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
